<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-Tac-Toe</title>
    <style>
      :root {
        --bg: #0e0f13;
        --panel: #16181f;
        --cell: #20242e;
        --cell-hover: #2a2f3b;
        --x: #5ab0ff;
        --o: #ff8d72;
        --text: #e8eaee;
        --muted: #8b919d;
        --line: #3a4150;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      .game {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .status {
        font-size: 16px;
        min-height: 24px;
        color: var(--muted);
        text-align: center;
      }
      .status .turn-x { color: var(--x); font-weight: 600; }
      .status .turn-o { color: var(--o); font-weight: 600; }
      .status .win    { color: var(--text); font-weight: 700; }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 90px);
        grid-template-rows: repeat(3, 90px);
        gap: 6px;
        background: var(--panel);
        padding: 6px;
        border-radius: 14px;
      }

      .cell {
        border: none;
        border-radius: 9px;
        background: var(--cell);
        color: var(--text);
        font-size: 42px;
        font-weight: 700;
        cursor: pointer;
        display: grid;
        place-items: center;
        font-family: inherit;
        transition: background 0.1s ease;
      }
      .cell:hover:not(:disabled) { background: var(--cell-hover); }
      .cell:disabled { cursor: default; }
      .cell.x { color: var(--x); }
      .cell.o { color: var(--o); }
      .cell.win { box-shadow: inset 0 0 0 2px var(--text); }

      .scoreboard {
        display: flex;
        gap: 28px;
        font-size: 13px;
        color: var(--muted);
      }
      .scoreboard b { color: var(--text); font-size: 18px; }
      .score-x b { color: var(--x); }
      .score-o b { color: var(--o); }

      button.reset {
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--cell);
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.1s ease;
      }
      button.reset:hover { background: var(--cell-hover); }
    </style>
  </head>
  <body>
    <div class="game">
      <h1>Tic-Tac-Toe</h1>
      <div class="status" id="status"></div>
      <div class="board" id="board"></div>
      <div class="scoreboard">
        <span class="score-x">X <b id="scoreX">0</b></span>
        <span>Draws <b id="scoreD">0</b></span>
        <span class="score-o">O <b id="scoreO">0</b></span>
      </div>
      <button class="reset" id="reset">New Round</button>
    </div>

    <script>
      const LINES = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
      ];

      function evaluate(board) {
        for (const [a, b, c] of LINES) {
          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return { winner: board[a], line: [a, b, c] };
          }
        }
        return { winner: null, line: null };
      }

      const isFull = (board) => board.every((c) => c !== null);

      let board = Array(9).fill(null);
      let current = 'X';
      let outcome = null;
      let score = { X: 0, O: 0, D: 0 };

      const boardEl = document.getElementById('board');
      const statusEl = document.getElementById('status');
      const scoreXEl = document.getElementById('scoreX');
      const scoreOEl = document.getElementById('scoreO');
      const scoreDEl = document.getElementById('scoreD');

      function render() {
        boardEl.innerHTML = '';
        const winSet = outcome && outcome.line ? new Set(outcome.line) : new Set();
        board.forEach((mark, i) => {
          const cell = document.createElement('button');
          cell.className = 'cell';
          if (mark) cell.classList.add(mark.toLowerCase());
          if (winSet.has(i)) cell.classList.add('win');
          cell.textContent = mark ?? '';
          cell.disabled = mark !== null || outcome !== null;
          cell.addEventListener('click', () => play(i));
          boardEl.appendChild(cell);
        });

        if (outcome === 'draw') {
          statusEl.innerHTML = `<span class="win">Draw</span>`;
        } else if (outcome && outcome.winner) {
          statusEl.innerHTML = `<span class="win">${outcome.winner} wins</span>`;
        } else {
          const cls = current === 'X' ? 'turn-x' : 'turn-o';
          statusEl.innerHTML = `<span class="${cls}">${current}</span> to move`;
        }

        scoreXEl.textContent = score.X;
        scoreOEl.textContent = score.O;
        scoreDEl.textContent = score.D;
      }

      function play(i) {
        if (board[i] !== null || outcome !== null) return;
        board[i] = current;
        const result = evaluate(board);
        if (result.winner) {
          outcome = result;
          score[result.winner]++;
        } else if (isFull(board)) {
          outcome = 'draw';
          score.D++;
        } else {
          current = current === 'X' ? 'O' : 'X';
        }
        render();
      }

      function newRound() {
        board = Array(9).fill(null);
        current = 'X';
        outcome = null;
        render();
      }

      document.getElementById('reset').addEventListener('click', newRound);
      render();
    </script>
  </body>
</html>
