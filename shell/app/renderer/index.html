<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>grasp — the post-editor</title>
<style>
  :root{
    --ground:#0f1216; --surface:#171b21; --surface-2:#131217;
    --ink:#e6e9ee; --muted:#8b95a5; --hair:#262c34;
    --accent:#5b9bff; --accent-bg:#132139; --question:#e0a852;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;overflow:hidden}
  header{padding:12px 18px;border-bottom:1px solid var(--hair);display:flex;
    align-items:baseline;gap:12px;flex:none}
  header .brand{font-weight:600;letter-spacing:.02em}
  header .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--hair);
    align-items:center;flex:none}
  .bar label{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .bar input{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);
    color:var(--ink);border:1px solid var(--hair);border-radius:7px;padding:7px 9px}
  .bar input:focus{outline:none;border-color:var(--accent)}
  #repo{width:220px} #entrypoint{width:280px} #input{width:200px} #old{width:110px}
  button{font-family:var(--sans);font-size:12.5px;font-weight:500;cursor:pointer;
    background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);
    border-radius:7px;padding:7px 14px}
  button.ghost{background:transparent;color:var(--muted);border-color:var(--hair)}
  button:hover{filter:brightness(1.12)}
  .tabs{display:flex;gap:2px;padding:8px 18px 0;flex:none}
  .tabs .t{font-size:12px;color:var(--muted);padding:6px 12px;border:1px solid transparent;
    border-bottom:none;border-radius:7px 7px 0 0;cursor:pointer}
  .tabs .t.on{color:var(--ink);background:var(--surface);border-color:var(--hair)}
  main{flex:1;min-height:0;position:relative}
  .pane{position:absolute;inset:0;display:none}
  .pane.on{display:block}
  #graphFrame{width:100%;height:100%;border:0;background:var(--ground)}
  .placeholder{height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;text-align:center;padding:0 40px;line-height:1.6}
  #status{font-family:var(--mono);font-size:12px;color:var(--question);padding:8px 18px;
    border-top:1px solid var(--hair);min-height:34px;white-space:pre-wrap;flex:none}
  /* terminal */
  #termout{height:calc(100% - 40px);overflow:auto;margin:0;padding:12px 16px;
    font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:pre-wrap}
  #terminput{width:100%;height:40px;background:var(--surface-2);color:var(--ink);
    border:0;border-top:1px solid var(--hair);padding:0 16px;font-family:var(--mono);font-size:12.5px}
  #terminput:focus{outline:none}
  /* browser */
  .urlbar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--hair)}
  .urlbar input{flex:1;font-family:var(--mono);font-size:12.5px;background:var(--surface-2);
    color:var(--ink);border:1px solid var(--hair);border-radius:7px;padding:7px 10px}
  webview{width:100%;height:calc(100% - 46px)}
</style>
</head>
<body>
  <header>
    <span class="brand">grasp</span>
    <span class="tag">the post-editor · observed dataflow</span>
  </header>

  <div class="bar">
    <label>repo</label><input id="repo" value="." />
    <label>entrypoint</label><input id="entrypoint" placeholder="module.func" />
    <label>input</label><input id="input" placeholder='{"name":"x"}' />
    <button id="observe">Observe</button>
    <label>old</label><input id="old" placeholder="HEAD~1" />
    <button id="diff" class="ghost">Diff A→B</button>
  </div>

  <div class="tabs" id="tabs">
    <div class="t on" data-pane="graph">Dataflow</div>
    <div class="t" data-pane="term" data-full>Terminal</div>
    <div class="t" data-pane="web" data-full>Browser</div>
  </div>

  <main>
    <div class="pane on" data-pane="graph">
      <iframe id="graphFrame" sandbox="allow-same-origin"></iframe>
      <div class="placeholder" id="graphPlaceholder">
        Point at a repo + entrypoint and press <b>&nbsp;Observe&nbsp;</b> — grasp runs it
        for real and shows the observed dataflow, ending in a question. It never renders a verdict.
      </div>
    </div>
    <div class="pane" data-pane="term" data-full>
      <pre id="termout"></pre>
      <input id="terminput" placeholder="type a command, Enter to run…" />
    </div>
    <div class="pane" data-pane="web" data-full>
      <div class="urlbar">
        <input id="url" value="https://example.com" />
        <button id="go" class="ghost">Go</button>
      </div>
      <webview id="web" src="https://example.com"></webview>
    </div>
  </main>

  <div id="status"></div>

<script>
  const mode = new URLSearchParams(location.search).get("mode") || "full";
  const $ = (id) => document.getElementById(id);
  const status = (m) => { $("status").textContent = m || ""; };

  // In graft mode (inside ZCode) only the dataflow pane is ours — ZCode owns the
  // terminal + browser. Hide the extra tabs unless we're the standalone app.
  if (mode !== "full") {
    document.querySelectorAll('[data-full]').forEach((el) => el.remove());
  }

  // tabs
  document.querySelectorAll('.tabs .t').forEach((t) => t.addEventListener('click', () => {
    const p = t.dataset.pane;
    document.querySelectorAll('.tabs .t').forEach((x) => x.classList.toggle('on', x === t));
    document.querySelectorAll('.pane').forEach((x) => x.classList.toggle('on', x.dataset.pane === p));
  }));

  async function run(cap) {
    const repo = $("repo").value.trim();
    const entrypoint = $("entrypoint").value.trim();
    if (!entrypoint) { status("enter an entrypoint (module.func)"); return; }
    const params = { cap, repo, entrypoint, input: $("input").value.trim() };
    if (cap === "diff") params.old = $("old").value.trim() || "HEAD~1";
    status("running the entrypoint for real…");
    const res = await window.grasp.run(params);
    if (res && res.ok && res.html) {
      $("graphPlaceholder").style.display = "none";
      $("graphFrame").srcdoc = res.html;
      status("");
    } else {
      $("graphFrame").srcdoc = "";
      $("graphPlaceholder").style.display = "flex";
      status((res && res.err) ? res.err.trim() : "could not observe — no output from the engine");
    }
  }
  $("observe").addEventListener('click', () => run("observe"));
  $("diff").addEventListener('click', () => run("diff"));

  // demo seed (used for a first-run screenshot): prefill + observe once.
  if (new URLSearchParams(location.search).get("demo")) {
    $("repo").value = ".";
    $("entrypoint").value = "flow_canaries.scenarios.create_organization";
    $("input").value = '{"name":"Acme"}';
    window.addEventListener("load", () => setTimeout(() => run("observe"), 400));
  }

  // terminal (standalone only)
  if (mode === "full" && window.grasp.onTermData) {
    const out = $("termout");
    window.grasp.onTermData((d) => { out.textContent += d; out.scrollTop = out.scrollHeight; });
    $("terminput").addEventListener('keydown', (e) => {
      if (e.key === "Enter") { window.grasp.termInput(e.target.value); e.target.value = ""; }
    });
    const go = $("go"), url = $("url"), web = $("web");
    if (go && web) go.addEventListener('click', () => {
      let u = url.value.trim(); if (!/^https?:\/\//.test(u)) u = "https://" + u; web.src = u;
    });
  }
</script>
</body>
</html>
